<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>归档 · Furcut 的小站</title>
<meta name="author" content="Furcut">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ctext x='50' y='70' font-size='58' font-family='system-ui,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EF%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#ffffff; --card:#ffffff; --text:#111827; --muted:#6b7280;
    --line:#e5e7eb; --brand:#6366f1; --brand-2:#8b5cf6; --shadow:0 10px 30px rgba(17,24,39,.08);
  }
  [data-theme="dark"]{
    --bg:#0b0d12; --card:#141821; --text:#e8eaed; --muted:#9aa3b2;
    --line:#232936; --brand:#818cf8; --brand-2:#a78bfa; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark){
    [data-theme="auto"]{
      --bg:#0b0d12; --card:#141821; --text:#e8eaed; --muted:#9aa3b2;
      --line:#232936; --brand:#818cf8; --brand-2:#a78bfa; --shadow:0 10px 30px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);line-height:1.75;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;transition:background .25s ease,color .25s ease}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px}
  header.nav{position:sticky;top:0;z-index:20;backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;align-items:center;gap:18px;height:62px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800}
  .logo .dot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:14px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2))}
  .nav-links{display:flex;gap:20px;margin-left:auto;font-size:14px;color:var(--muted)}
  .nav-links a:hover{color:var(--text)}
  .toggle{border:1px solid var(--line);background:var(--card);color:var(--text);width:36px;height:36px;border-radius:10px;cursor:pointer}
  main{padding:52px 0 64px}
  .back{font-size:14px;color:var(--muted);display:inline-block;margin-bottom:24px}
  .back:hover{color:var(--brand)}
  h1{font-size:clamp(28px,4.4vw,38px);letter-spacing:-.8px;margin:0 0 8px}
  .sub{color:var(--muted);font-size:14.5px;margin:0 0 30px}
  .year{font-size:13px;letter-spacing:.12em;color:var(--brand);font-weight:700;margin:30px 0 10px}
  .item{display:flex;gap:16px;padding:14px 0;border-bottom:1px dashed var(--line)}
  .item:last-child{border-bottom:none}
  .item time{flex:0 0 84px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
  .item a{font-weight:600}
  .item a:hover{color:var(--brand)}
  footer{padding:32px 0 56px;border-top:1px solid var(--line);color:var(--muted);font-size:13.5px}
  .foot-inner{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  @media (max-width:600px){ .item{flex-direction:column;gap:2px} .item time{flex:none} }
</style>
</head>
<body>
<header class="nav">
  <div class="wrap nav-inner">
    <a class="logo" href="/"><span class="dot">F</span> Furcut</a>
    <nav class="nav-links">
      <a href="/#about">关于</a>
      <a href="/#posts">文章</a>
      <a href="/archives/">归档</a>
      <a href="https://github.com/Furcut-Flac" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <button class="toggle" id="themeToggle" title="切换主题">◐</button>
  </div>
</header>

<main class="wrap">
  <a class="back" href="/">← 返回首页</a>
  <h1>归档</h1>
  <p class="sub">全部文章，按时间排列。</p>

  <div class="year">2026</div>
  <div class="item">
    <time datetime="2026-10-26">10-26</time>
    <a href="/2026/10/26/hello-world/">Hello World</a>
  </div>
</main>

<footer>
  <div class="wrap foot-inner">
    <div>© <span id="year">2026</span> Furcut</div>
    <div><a href="/">首页</a> · <a href="/#posts">文章</a></div>
  </div>
</footer>

<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themeToggle');
  var saved=localStorage.getItem('theme');
  if(saved){root.setAttribute('data-theme',saved);}
  btn.addEventListener('click',function(){
    var next = root.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
    root.setAttribute('data-theme',next);
    localStorage.setItem('theme',next);
  });
  document.getElementById('year').textContent=new Date().getFullYear();
})();
</script>
</body>
</html>
